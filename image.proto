syntax = "proto3";

package image;

option go_package = "github.com/NodePath81/mspmv2-proto/image";

message ImageTags{
    repeated string user_specified_tags = 1;
    repeated string auto_generated_tags = 2;
}

message ImageMetadata {
    string image_id = 1;
    string user_id = 2;
    reserved 3;
    repeated float embedding = 4;
    ImageTags tags = 5;
    int64 uploaded_at = 6;
    reserved 7;
    string file_name = 8;
    optional string category = 9;
    uint32 width = 10;
    uint32 height = 11;
    string file_type = 12;
}