syntax = "proto3";

package aggregator;

option go_package = "github.com/NodePath81/mspmv2-proto/aggregator";

service AggregatorService {
    rpc AddImageMetadata (AddImageMetadataRequest) returns (AddImageMetadataResponse);
}

// Trigger image-metadata-service to fetch Task* from redis store of aggregator
message AddImageMetadataRequest {
    string task_id = 1;
    string image_id = 2;
}

// Return the task id
message AddImageMetadataResponse {
    string task_id = 1;
}